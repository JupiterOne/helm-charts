{{- if .Values.createSecret }}
{{- if or (not .Values.apiToken) (eq .Values.apiToken "<api-token>") }}
{{- fail "apiToken is required when createSecret is true (or set createSecret=false and provide the Secret yourself)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretAPITokenName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  token: {{ .Values.apiToken | b64enc }}
{{- end }}
