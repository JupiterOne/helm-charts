{{- if .Values.certmanager.enable }}
# Self-signed Issuer
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with (include "chart.annotations" (dict "ctx" .)) }}{{ . | nindent 2 }}{{ end }}
  name: selfsigned-issuer
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
{{- if .Values.metrics.enable }}
---
# Certificate for the metrics
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  {{- $keep := ternary (dict "helm.sh/resource-policy" "keep") (dict) (.Values.crd.keep | default false) }}
  {{- with (include "chart.annotations" (dict "ctx" . "specific" $keep)) }}{{ . | nindent 2 }}{{ end }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: metrics-certs
  namespace: {{ .Release.Namespace }}
spec:
  dnsNames:
    - jupiterone-integration-operator.{{ .Release.Namespace }}.svc
    - jupiterone-integration-operator.{{ .Release.Namespace }}.svc.cluster.local
    - jupiterone-integration-operator-metrics-service.{{ .Release.Namespace }}.svc
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: metrics-server-cert
  {{- /* Labels and annotations for the Secret cert-manager creates. */}}
  {{- $secretLabels := include "chart.userLabels" (dict "ctx" .) | trim }}
  {{- $secretAnnotations := include "chart.userAnnotations" (dict "ctx" . "skipPrefix" "cert-manager.io/") | trim }}
  {{- if or $secretLabels $secretAnnotations }}
  secretTemplate:
    {{- with $secretLabels }}
    labels:
      {{- . | nindent 6 }}
    {{- end }}
    {{- with $secretAnnotations }}
    annotations:
      {{- . | nindent 6 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
