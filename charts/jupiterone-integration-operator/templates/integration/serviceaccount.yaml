{{- if .Values.integration.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.integration.serviceAccountName }}
  namespace: {{ .Values.integration.serviceAccountNamespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with (include "chart.annotations" (dict "ctx" . "specific" .Values.integration.serviceAccount.annotations)) }}{{ . | nindent 2 }}{{ end }}
{{- end }}
