# Overrides the chart name used in the app.kubernetes.io/name label.
nameOverride: ""

# [MANAGER]: Manager Deployment Configurations
controllerManager:
  replicas: 1
  container:
    image:
      repository: ghcr.io/jupiterone/jupiterone-integration-operator
      tag: "" # Use the appVersion from the chart unless overridden by command line
    args:
      - "--leader-elect"
      - "--metrics-bind-address=:8443"
      - "--health-probe-bind-address=:8081"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 64Mi
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 20
      httpGet:
        path: /healthz
        port: 8081
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      httpGet:
        path: /readyz
        port: 8081
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
    env:
      JOB_TTL_SECONDS: "604800" # 7 days in seconds
      # How long resolved AWS Secrets Manager values are cached, in seconds.
      # Only used when a CR reads credentials via secretSource/apiTokenSource
      # with provider "awsSecretsManager". Defaults to 60; set to "0" to disable.
      # ASM_CACHE_TTL_SECONDS: "60"
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Extra labels and annotations on the manager Deployment.
  # Quote numeric values ("1234"): Helm reads unquoted numbers as floats.
  deployment:
    labels: {}
    annotations: {}
  # Extra labels and annotations on the manager pod.
  pod:
    labels: {}
    annotations: {}
  # Scheduling for the manager pod.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 10
  serviceAccountName: jupiterone-integration-operator-controller-manager
  # Annotations applied to the operator ServiceAccount.
  # Required to read credentials from AWS Secrets Manager on EKS, which grants
  # the operator an IAM role via IRSA.
  # Example:
  #   serviceAccount:
  #     annotations:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
  serviceAccount:
    annotations: {}
  # Image registry override for private registry environments.
  # When set, integration job images are pulled from this registry instead of ghcr.io.
  # Example: "myregistry.example.com" produces images like "myregistry.example.com/jupiterone/graph-aws:latest"
  imageRegistry: ""
  # Disable cosign image signature verification for integration job images.
  # Set to true when using private registries that don't mirror ghcr.io cosign signatures.
  # When false or unset, cosign verification runs as normal against ghcr.io signatures.
  disableImageSignatureCheck: false
  # Secrets for pulling images from private registries.
  # Applied to both the operator Deployment pod and propagated to spawned integration job pods.
  # Example:
  #   imagePullSecrets:
  #     - name: my-registry-secret
  imagePullSecrets: []
  # Resource requests and limits applied to integration job containers.
  # Configure these to comply with cluster resource policies (e.g. Kyverno, OPA/Gatekeeper).
  # When empty, no resource requirements are set on job containers.
  # Example:
  #   jobResources:
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  #     limits:
  #       cpu: "1"
  #       memory: 1Gi
  jobResources: {}
  # Labels, annotations, scheduling and security context for every integration
  # run (JOB_OVERRIDES). Requires operator v0.6.0+.
  # - labels/annotations: every object the operator creates for a run (runner
  #   auth Secret, run Secret, IntegrationInstanceJob, job Secret, Job).
  # - podLabels/podAnnotations: the job pod.
  # - nodeSelector, tolerations, affinity, podSecurityContext,
  #   containerSecurityContext: the job pod spec.
  # An integration chart's jobLabels/jobAnnotations/podLabels/podAnnotations
  # are merged over these for that instance's runs.
  # Keys the operator manages are rejected: app.kubernetes.io/name, log-watcher,
  # job-name, controller-uid, batch.kubernetes.io/*, integrations.jupiterone.io/*.
  # An invalid value stops the new operator pod at startup (the previous pod
  # keeps running); check `kubectl rollout status` after upgrading.
  # Quote numeric values ("1234"): Helm reads unquoted numbers as floats.
  # Integration images run as root, so a Pod Security "restricted" namespace
  # is not supported yet.
  # Example:
  #   job:
  #     podLabels:
  #       team: security
  #     podAnnotations:
  #       sidecar.istio.io/inject: "false"
  #     nodeSelector:
  #       pool: tools
  #     tolerations:
  #       - key: dedicated
  #         operator: Equal
  #         value: tools
  #         effect: NoSchedule
  #     containerSecurityContext:
  #       allowPrivilegeEscalation: false
  #       capabilities:
  #         drop: ["ALL"]
  job:
    labels: {}
    annotations: {}
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podSecurityContext: {}
    containerSecurityContext: {}

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: false

# [CRD]: Keep the operator CRDs (IntegrationRunner, IntegrationInstance,
# IntegrationInstanceJob) and the metrics Certificate on helm uninstall by
# annotating them helm.sh/resource-policy: keep. Custom resources survive the
# uninstall; delete the CRDs by hand to remove them.
crd:
  keep: false

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [INTEGRATION]: Kubernetes Managed Integration RBAC configuration
integration:
  # Specifies whether to create integration RBAC resources
  create: true
  # Service account name for the cluster role binding
  serviceAccountName: jupiterone
  # Service account namespace for the cluster role binding
  # NOTE: We don't support changing this at this time
  serviceAccountNamespace: jupiterone
  # Annotations applied to the kubernetes-managed integration ServiceAccount
  # above. Use this to give that integration an AWS identity via IRSA.
  # Example:
  #   serviceAccount:
  #     annotations:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
  serviceAccount:
    annotations: {}
  # ServiceAccount used by every other integration job pod (for example SBOM for
  # AWS ECR). Integration job pods run as "default" until a name is set here,
  # which is passed to the operator as INTEGRATION_JOB_SERVICE_ACCOUNT.
  # Annotate it to grant the job pods an AWS identity via IRSA, including
  # cross-account access where the annotated role assumes a role in the account
  # that owns the ECR registry.
  # Example:
  #   jobServiceAccount:
  #     create: true
  #     annotations:
  #       eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
  jobServiceAccount:
    # Create the ServiceAccount. Set to false to reference one managed elsewhere.
    create: false
    # Defaults to "jupiterone-integration-job" when created.
    name: ""
    annotations: {}
