name: Release Chart

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  publish-oci:
    name: Request OCI chart publish
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # The internal operator repo publishes OCI charts to GHCR and Public ECR with a pinned ci-tools.
      - name: Dispatch to jupiterone-integration-operator
        env:
          GH_TOKEN: ${{ secrets.AUTO_GITHUB_PAT_TOKEN }}
        run: |
          gh api repos/JupiterOne/jupiterone-integration-operator/dispatches \
            -f event_type=helm-charts-released \
            -f "client_payload[sha]=$GITHUB_SHA"
