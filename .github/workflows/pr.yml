name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-operator-crds:
    name: Verify Operator CRDs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Operator repository token
        id: operator-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: JupiterOne
          repositories: jupiterone-integration-operator
          permission-contents: read

      - name: Verify CRDs are in sync
        run: make verify-crds
        env:
          GH_TOKEN: ${{ steps.operator-token.outputs.token }}

  chart-tests:
    name: Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helm-charts

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Lint charts
        run: |
          helm lint helm-charts/charts/jupiterone-integration-operator
          helm lint helm-charts/charts/jupiterone-integration-runner \
            --set accountID=ci --set apiToken=ci

      - name: Run chart render tests
        run: |
          set -euo pipefail
          status=0
          for script in \
            helm-charts/charts/jupiterone-integration-operator/tests/declared-values_test.sh \
            helm-charts/charts/jupiterone-integration-operator/tests/private-registry-values_test.sh \
            helm-charts/charts/jupiterone-integration-operator/tests/irsa-service-account_test.sh \
            helm-charts/charts/jupiterone-integration-operator/tests/job-overrides-values_test.sh \
            helm-charts/charts/jupiterone-integration-operator/tests/common-labels_test.sh \
            helm-charts/charts/jupiterone-integration-runner/tests/runner-values_test.sh \
            helm-charts/scripts/semver_test.sh; do
            echo "::group::$script"
            bash "$script" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  chartgen-tests:
    name: chartgen Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The render tests run `helm template` and skip without helm.
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Run chartgen tests
        run: go test ./cmd/chartgen/...

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      regression: ${{ steps.diff.outputs.regression }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect regression-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "regression=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if grep -qE '^(charts/jupiterone-integration-operator/|test/regression/|\.github/workflows/pr\.yml$|Makefile$)' <<<"$changed"; then
            echo "regression=true" >>"$GITHUB_OUTPUT"
          else
            echo "regression=false" >>"$GITHUB_OUTPUT"
          fi

  regression:
    name: Regression (Terratest)
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.regression != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/regression/go.mod
          cache-dependency-path: test/regression/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - name: Run regression suite
        run: make test-regression

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  request-review:
    name: Request review + auto-merge
    needs: [changes, verify-operator-crds, chart-tests, chartgen-tests, regression, actionlint]
    if: >-
      always() && !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      ((github.event_name == 'workflow_dispatch' &&
       startsWith(github.ref_name, 'automation/operator-v') &&
       github.actor == 'github-actions[bot]') ||
      (github.event_name == 'pull_request' &&
       github.actor == 'dependabot[bot]' &&
       github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify automation pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_AUTHOR: ${{ github.event_name == 'pull_request' && 'app/dependabot' || 'app/github-actions' }}
          IS_OPERATOR_BUMP: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,author,headRefOid,baseRefName,isCrossRepository,files --jq '.[0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::No open pull request for $BRANCH"
            exit 1
          fi
          number=$(jq -r '.number' <<<"$pr")
          author=$(jq -r '.author.login' <<<"$pr")
          head=$(jq -r '.headRefOid' <<<"$pr")
          base=$(jq -r '.baseRefName' <<<"$pr")
          cross=$(jq -r '.isCrossRepository' <<<"$pr")
          if [ "$author" != "$EXPECTED_AUTHOR" ]; then
            echo "::error::PR #$number author is $author, expected $EXPECTED_AUTHOR"
            exit 1
          fi
          if [ "$cross" != "false" ]; then
            echo "::error::PR #$number comes from a fork"
            exit 1
          fi
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::error::PR #$number head $head differs from tested commit $HEAD_SHA"
            exit 1
          fi
          if [ "$base" != "main" ]; then
            echo "::error::PR #$number targets $base, expected main"
            exit 1
          fi
          if [ "$IS_OPERATOR_BUMP" = "true" ]; then
            unexpected=$(jq -r '.files[].path' <<<"$pr" | grep -vxE 'charts/jupiterone-integration-operator/(Chart\.yaml|templates/crds/[^/]+\.yaml)' || true)
            if [ -n "$unexpected" ]; then
              echo "::error::PR #$number changes files outside the operator bump allowlist: $unexpected"
              exit 1
            fi
            chart_changes=$(gh pr diff "$number" --repo "$GITHUB_REPOSITORY" |
              awk '/^diff --git/ { in_chart = ($0 ~ /Chart\.yaml$/) } in_chart && /^[-+]/ && !/^(---|\+\+\+) / { print }' |
              grep -vE '^[-+](version|appVersion): ' || true)
            if [ -n "$chart_changes" ]; then
              echo "::error::PR #$number changes Chart.yaml beyond version and appVersion: $chart_changes"
              exit 1
            fi
          fi
          {
            echo "number=$number"
            echo "head=$head"
          } >>"$GITHUB_OUTPUT"

      - name: Repository token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: JupiterOne
          repositories: helm-charts
          permission-contents: write
          permission-members: read
          permission-pull-requests: write
          permission-workflows: write

      - name: Request code-owner review and enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD_SHA"
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/requested_reviewers" \
            -f 'team_reviewers[]=integrations' --silent
